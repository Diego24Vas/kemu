[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kemu"
version = "1.0.0"
description = "Asistente CLI interactivo para gestión y creación de máquinas virtuales con QEMU/KVM"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "GPL-3.0-or-later" }
authors = [
    { name = "Diego24Vas" }
]
dependencies = [
    "questionary>=2.0.0",
]
keywords = ["qemu", "kvm", "virtual-machines", "cli", "linux"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Emulators",
]

[project.urls]
Homepage = "https://github.com/Diego24Vas/kemu"
Repository = "https://github.com/Diego24Vas/kemu"
Issues = "https://github.com/Diego24Vas/kemu/issues"

[project.scripts]
kemu = "main:cli"

[tool.setuptools]
py-modules = ["main"]
